name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run check:auth
      - run: npm test
      - run: npm run build
      - name: SBOM and checksums
        run: |
          npm sbom --sbom-format cyclonedx > sbom.cdx.json
          find .vercel/output/static/assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum sbom.cdx.json >> SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            sbom.cdx.json
            SHA256SUMS.txt
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            sbom.cdx.json \
            SHA256SUMS.txt
