name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

      - name: Start dev server
        run: |
          npm run dev > "$RUNNER_TEMP/vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/vite.pid"

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/__app-env >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo "Dev server did not become ready"
          cat "$RUNNER_TEMP/vite.log"
          exit 1

      - name: Check auth invariant
        run: npm run check:auth

      - name: Stop dev server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/vite.pid" ]; then
            kill $(cat "$RUNNER_TEMP/vite.pid") 2>/dev/null || true
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
